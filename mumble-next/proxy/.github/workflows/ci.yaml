name: CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'proxy/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'proxy/**'

env:
  GO_VERSION: '1.21'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: proxy

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        working-directory: proxy
        run: go mod download

      - name: Run tests
        working-directory: proxy
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: proxy/coverage.out
          flags: proxy

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: proxy
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          go build -ldflags "-X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$BUILD_DATE" \
            -o bin/mumble-proxy ./cmd/mumble-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: mumble-proxy-linux-amd64
          path: proxy/bin/mumble-proxy

  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: proxy
        run: docker build -t mumble-proxy:latest .

      - name: Test Docker image
        run: |
          docker run --rm -d --name mumble-proxy-test -p 8080:8080 mumble-proxy:latest
          sleep 5
          curl -f http://localhost:8080/healthz || exit 1
          docker stop mumble-proxy-test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run E2E tests
        working-directory: proxy
        run: go test -v -race ./test/e2e/...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all platforms
        working-directory: proxy
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$BUILD_DATE"

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mumble-proxy-linux-amd64 ./cmd/mumble-proxy
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/mumble-proxy-linux-arm64 ./cmd/mumble-proxy

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mumble-proxy-darwin-amd64 ./cmd/mumble-proxy
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/mumble-proxy-darwin-arm64 ./cmd/mumble-proxy

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mumble-proxy-windows-amd64.exe ./cmd/mumble-proxy

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: proxy/bin/*
          generate_release_notes: true